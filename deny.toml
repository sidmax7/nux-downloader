# cargo-deny configuration. Run locally with `cargo deny check`
# (`cargo install cargo-deny`); CI runs it via EmbarkStudios/cargo-deny-action.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # libbz2-rs-sys (pure-Rust bzip2, pulled in by the zip / 7z readers):
    # the bzip2 licence is a permissive BSD-style one.
    "bzip2-1.0.6",
    # webpki-roots (Mozilla's CA root bundle, pulled in via reqwest's
    # rustls-tls) is licensed under this data license, not a code
    # license — standard for a bundled certificate list, not a
    # copyleft/attribution concern for us.
    "CDLA-Permissive-2.0",
    # option-ext (a tiny platform-detection shim pulled in transitively
    # via `directories` -> `dirs-sys`, for the XDG basedir fallback on
    # BSD/Redox). MPL-2.0's copyleft is file-scoped: it only requires
    # sharing changes to option-ext's *own* source files, not anything
    # that merely links against it — we consume it unmodified as a
    # compiled dependency, so this carries no obligation on this crate's
    # own code.
    "MPL-2.0",
]
# UnRAR (Phase 5, only if extraction ships) is proprietary and reviewed
# separately (IMPLEMENTATION_PLAN.md P9.8) — not pre-approved here.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
