[package]
name = "nuxd"
description = "Nux Downloader command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nuxd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nuxd-core = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"

[dev-dependencies]
nuxd-testkit = { workspace = true }
tempfile = "3"
