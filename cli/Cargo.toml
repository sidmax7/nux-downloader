[package]
name = "nuxd"
description = "Nux Downloader command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nuxd"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["rar"]
# RAR extraction (the UnRAR library: freeware, not open source). Builds
# for repositories that exclude non-free code use `--no-default-features`.
rar = ["nuxd-core/rar"]

[dependencies]
nuxd-core = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"

[dev-dependencies]
nuxd-testkit = { workspace = true }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
