name: CI

# Pushes and pull requests check Linux only: that is the platform being
# released. "Run workflow" on the Actions tab (workflow_dispatch) adds the
# macOS and Windows legs, for when they can be debugged on real machines.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the Tauri shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      # `tauri::generate_context!` embeds ui/dist, so it must exist.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Package-manager builds of the app leave the self-updater out.
      - run: cargo clippy -p nuxd-app --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the Tauri shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      # `tauri::generate_context!` embeds ui/dist, so it must exist.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      # The multi-link tests bind to 127.0.0.2/.3/.4. Linux and Windows
      # treat all of 127/8 as loopback; macOS needs explicit aliases.
      - name: Add loopback aliases (macOS)
        if: runner.os == 'macOS'
        run: |
          for n in 2 3 4; do sudo ifconfig lo0 alias 127.0.0.$n up; done
      # On Windows a Tauri crate's *test* binary can't start
      # (STATUS_ENTRYPOINT_NOT_FOUND): Tauri links its Windows manifest
      # into the app binary only. Those tests (settings, IPC bindings) are
      # platform-independent and run on Linux and macOS; the app itself is
      # built on Windows by the `app` job.
      - run: cargo test --workspace --all-targets
        if: runner.os != 'Windows'
      - run: cargo test --workspace --all-targets --exclude nuxd-app
        if: runner.os == 'Windows'
      # RAR extraction builds the UnRAR C++ sources, so it is its own
      # (opt-in) feature; exercise it where a C++ toolchain is certain.
      - name: Test with RAR support
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p nuxd-core --features rar --test extract

  ui:
    name: ui (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui lint
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

  app:
    name: app build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the Tauri shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      # Builds the UI, then the app (no installers yet: that is Phase 9).
      - run: ../ui/node_modules/.bin/tauri build --no-bundle
        working-directory: src-tauri
        shell: bash

  # Drives the built app through tauri-driver (WebDriver). Linux only for
  # now; the Windows leg needs msedgedriver and has not been tried.
  e2e:
    name: end-to-end (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - run: ../ui/node_modules/.bin/tauri build --no-bundle
        working-directory: src-tauri
      - name: Run
        working-directory: ui
        env:
          NUXD_APP: ../target/release/nux-downloader
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        # tauri-driver starts the app, so it must run inside the virtual
        # display too, not only the test runner.
        run: xvfb-run -a bash -c 'tauri-driver & sleep 2; pnpm e2e'

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
