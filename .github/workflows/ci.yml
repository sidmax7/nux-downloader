name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The multi-link tests bind to 127.0.0.2/.3/.4. Linux and Windows
      # treat all of 127/8 as loopback; macOS needs explicit aliases.
      - name: Add loopback aliases (macOS)
        if: runner.os == 'macOS'
        run: |
          for n in 2 3 4; do sudo ifconfig lo0 alias 127.0.0.$n up; done
      - run: cargo test --workspace --all-targets
      # RAR extraction builds the UnRAR C++ sources, so it is its own
      # (opt-in) feature; exercise it where a C++ toolchain is certain.
      - name: Test with RAR support
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p nuxd-core --features rar --test extract

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
