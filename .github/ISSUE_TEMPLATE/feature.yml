name: Feature request
description: Suggest something new or better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: |
        Out of scope, by design: bypassing captchas or waiting pages, breaking DRM or stream protection, and sharing or cracking premium accounts on file-hosting sites.
