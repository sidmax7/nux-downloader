name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or `nuxd --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [AppImage, .deb, .rpm, AUR, Windows installer, macOS .dmg, Built from source]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Diagnostics → Copy (or `nuxd diagnostics`). Links in it are cut down to host and path.
      render: text
