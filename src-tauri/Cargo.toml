[package]
name = "nuxd-app"
description = "Nux Downloader desktop app (Tauri shell over nuxd-core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The installed program is `nux-downloader`; the CLI owns `nuxd`.
[[bin]]
name = "nux-downloader"
path = "src/main.rs"

[lib]
name = "nuxd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["self-update"]
# In-app updates from GitHub Releases. Package-manager builds (AUR, distro
# packages) turn it off: `--no-default-features`.
self-update = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nuxd-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = "1"
directories = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
