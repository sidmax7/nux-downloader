[package]
name = "nuxd-core"
description = "Nux Downloader engine: no UI or Tauri dependency, usable headlessly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }
# Already in the dependency tree transitively via `url`; used directly
# here for RFC 5987 `filename*=` and URL path-segment decoding — the
# Rust equivalent of Plexo's `decodeURIComponent`.
percent-encoding = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
