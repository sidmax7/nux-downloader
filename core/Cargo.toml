[package]
name = "nuxd-core"
description = "Nux Downloader engine: no UI or Tauri dependency, usable headlessly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }
# Already in the dependency tree transitively via `url`; used directly
# here for RFC 5987 `filename*=` and URL path-segment decoding — the
# Rust equivalent of Plexo's `decodeURIComponent`.
percent-encoding = "2"
fs4 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
if-addrs = { workspace = true }

# Verification (§12.3) and extraction (§12.4).
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
zip = { version = "9", default-features = false, features = ["deflate", "bzip2"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
# RAR is behind a feature: `unrar` wraps the UnRAR source, which is
# freeware, not open source (§12.4, Decision 36). The app and `nuxd` turn
# it on by default; the library stays opt-in.
unrar = { version = "0.5", optional = true }

[features]
rar = ["dep:unrar"]

# The FSCTL_SET_SPARSE call in storage::file's windows_sparse submodule
# (§9.1) is the one place `unsafe_code` is allowed in this crate; it only
# exists on Windows, so this dependency is target-gated out everywhere
# else. NOT independently verified on Windows — no Windows toolchain in
# the environment that wrote it; check it compiles and works once CI
# (P0.4) or a real Windows machine can run it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
nuxd-testkit = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Tests build 7z fixtures, so they need the encoder.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
