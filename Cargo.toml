[workspace]
resolver = "3"
members = ["core", "core/testkit", "cli", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
# `repository` is added once the GitHub repo exists (see IMPLEMENTATION_PLAN.md).

# Shared dependency versions — crates in this workspace pull from here
# with `{ workspace = true }` so versions can't drift between them.
[workspace.dependencies]
nuxd-core = { path = "core", version = "0.2.1" }
nuxd-testkit = { path = "core/testkit", version = "0.2.1" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
if-addrs = "0.13"
governor = "0.7"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["time"] }
async-trait = "0.1"
bytes = "1"
url = "2"
fs4 = { version = "0.9", features = ["tokio"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Release binaries ship without debug symbols (smaller downloads).
[profile.release]
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
